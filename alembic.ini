# A generic, single database configuration.
[alembic]
script_location = alembic
sqlalchemy.url = ${ASYNC_DATABASE_URI}


[post_write_hooks]
hooks = pg_validate
pg_validate.type = python
pg_validate.entrypoint = alembic_post_write_hooks.validate_sql

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
