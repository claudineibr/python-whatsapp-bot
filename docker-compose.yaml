services:
  static-site:
    image: dockersamples/static-site
    build: .
    ports:
      - "80:80"
    restart: always

  ngrok:
    image: ngrok/ngrok:latest
    depends_on:
      - python_app
    env_file:
      - .env
    command:
      - "http"
      - "http://host.docker.internal:8000"
    ports:
      - "4040:4040"

  python_app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
       - PYTHONUNBUFFERED=1
    volumes:
      - .:/app
    tty: true
